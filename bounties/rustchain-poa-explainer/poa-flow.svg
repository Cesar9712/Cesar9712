<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><rect width="1200" height="1500" fill="#10131a"/><text x="600" y="100" text-anchor="middle" fill="#f5a623" font-size="54" font-family="sans-serif" font-weight="700">RustChain Proof-of-Antiquity</text><text x="600" y="155" text-anchor="middle" fill="#e8edf5" font-size="28" font-family="sans-serif">Real CPUs vote. Older verified hardware gets more weight.</text><g font-family="sans-serif"><rect x="120" y="230" width="960" height="190" rx="24" fill="#202938"/><text x="170" y="290" fill="#fff" font-size="36" font-weight="700">1 · Start a real CPU</text><text x="170" y="345" fill="#d7dfeb" font-size="27">Install the miner: pip install clawrtc</text><text x="170" y="385" fill="#d7dfeb" font-size="27">Core rule: 1 CPU = 1 vote.</text><path d="M600 420v80" stroke="#f5a623" stroke-width="10"/><polygon points="600,520 575,485 625,485" fill="#f5a623"/><rect x="120" y="520" width="960" height="260" rx="24" fill="#202938"/><text x="170" y="580" fill="#fff" font-size="36" font-weight="700">2 · Hardware fingerprint</text><text x="170" y="635" fill="#d7dfeb" font-size="27">Six independent checks look for physical-hardware signals</text><text x="170" y="680" fill="#d7dfeb" font-size="27">and inconsistencies typical of VMs / emulation.</text><text x="170" y="735" fill="#f5a623" font-size="27" font-weight="700">The goal: reward honest hardware identity, not claimed specs.</text><path d="M600 780v80" stroke="#f5a623" stroke-width="10"/><polygon points="600,880 575,845 625,845" fill="#f5a623"/><rect x="120" y="880" width="960" height="260" rx="24" fill="#202938"/><text x="170" y="940" fill="#fff" font-size="36" font-weight="700">3 · Antiquity weighting</text><text x="170" y="995" fill="#d7dfeb" font-size="27">Verified vintage / exotic hardware can receive greater vote weight.</text><text x="170" y="1040" fill="#d7dfeb" font-size="27">Modern physical CPUs still participate at their applicable weight.</text><text x="170" y="1095" fill="#f5a623" font-size="27" font-weight="700">Antiquity changes weight — it does not create extra CPU votes.</text><path d="M600 1140v80" stroke="#f5a623" stroke-width="10"/><polygon points="600,1240 575,1205 625,1205" fill="#f5a623"/><rect x="120" y="1240" width="960" height="160" rx="24" fill="#202938"/><text x="170" y="1300" fill="#fff" font-size="36" font-weight="700">4 · VM / emulator?</text><text x="170" y="1350" fill="#d7dfeb" font-size="27">Failed fingerprinting ⇒ near-zero reward weight.</text><text x="600" y="1460" text-anchor="middle" fill="#9ba8ba" font-size="22">Original explainer by @Cesar9712 · Source: public RustChain documentation</text></g></svg>