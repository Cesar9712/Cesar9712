<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">RustChain Proof-of-Antiquity explainer</title>
<desc id="desc">A vertical flowchart explaining one CPU one vote, antiquity weighting, six hardware fingerprint checks, VM near-zero weighting, and the clawrtc install command.</desc>
<rect width="1200" height="1600" fill="#101318"/>
<rect x="70" y="60" width="1060" height="180" rx="28" fill="#1b222c" stroke="#f2a900" stroke-width="4"/>
<text x="600" y="130" fill="#f2a900" font-family="Arial,sans-serif" font-size="54" font-weight="700" text-anchor="middle">RustChain: Proof of Antiquity</text>
<text x="600" y="190" fill="#ffffff" font-family="Arial,sans-serif" font-size="30" text-anchor="middle">Real hardware participates. Older verified hardware can earn a larger weight.</text>

<rect x="100" y="300" width="1000" height="230" rx="24" fill="#18202a" stroke="#c8d0d9" stroke-width="3"/>
<text x="150" y="365" fill="#ffffff" font-family="Arial,sans-serif" font-size="38" font-weight="700">1. One CPU = one vote</text>
<text x="150" y="420" fill="#d8dee6" font-family="Arial,sans-serif" font-size="29">Each participating CPU represents one voting unit.</text>
<text x="150" y="465" fill="#d8dee6" font-family="Arial,sans-serif" font-size="29">Its reward weight is adjusted by verified hardware antiquity.</text>

<path d="M600 530 L600 610" stroke="#f2a900" stroke-width="8"/>
<polygon points="600,640 575,600 625,600" fill="#f2a900"/>

<rect x="100" y="650" width="1000" height="360" rx="24" fill="#18202a" stroke="#c8d0d9" stroke-width="3"/>
<text x="150" y="715" fill="#ffffff" font-family="Arial,sans-serif" font-size="38" font-weight="700">2. Six-check hardware fingerprint</text>
<text x="150" y="775" fill="#d8dee6" font-family="Arial,sans-serif" font-size="28">The miner reports measurable hardware signals used to distinguish</text>
<text x="150" y="815" fill="#d8dee6" font-family="Arial,sans-serif" font-size="28">physical machines from virtualized or emulated environments.</text>
<text x="150" y="880" fill="#f2a900" font-family="Arial,sans-serif" font-size="29" font-weight="700">Examples include:</text>
<text x="185" y="930" fill="#d8dee6" font-family="Arial,sans-serif" font-size="27">• cache timing • clock drift • thermal drift</text>
<text x="185" y="972" fill="#d8dee6" font-family="Arial,sans-serif" font-size="27">• jitter / platform signals • anti-emulation indicators</text>

<path d="M600 1010 L600 1090" stroke="#f2a900" stroke-width="8"/>
<polygon points="600,1120 575,1080 625,1080" fill="#f2a900"/>

<rect x="100" y="1130" width="470" height="230" rx="24" fill="#183322" stroke="#63d471" stroke-width="3"/>
<text x="335" y="1200" fill="#63d471" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle">Real hardware</text>
<text x="335" y="1255" fill="#ffffff" font-family="Arial,sans-serif" font-size="27" text-anchor="middle">Fingerprint passes</text>
<text x="335" y="1300" fill="#ffffff" font-family="Arial,sans-serif" font-size="27" text-anchor="middle">Antiquity weight applies</text>

<rect x="630" y="1130" width="470" height="230" rx="24" fill="#351b1b" stroke="#ff6868" stroke-width="3"/>
<text x="865" y="1200" fill="#ff6868" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle">VM / emulator</text>
<text x="865" y="1255" fill="#ffffff" font-family="Arial,sans-serif" font-size="27" text-anchor="middle">Anti-emulation can flag it</text>
<text x="865" y="1300" fill="#ffffff" font-family="Arial,sans-serif" font-size="27" text-anchor="middle">Reward weight becomes ~near-zero</text>

<rect x="100" y="1410" width="1000" height="120" rx="24" fill="#f2a900"/>
<text x="600" y="1463" fill="#101318" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">Start: pip install clawrtc</text>
<text x="600" y="1505" fill="#101318" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">Verify first with the miner's dry-run / payload inspection options.</text>
</svg>
